name: Database Backup

on:
  schedule:
    - cron: '0 19 * * *'  # 02:00 AM Bangkok time (UTC+7)
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client 18
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-18

      - name: Backup database
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          # Railway sometimes uses postgres:// — normalize to postgresql://
          DB_URL="${DATABASE_URL/postgres:\/\//postgresql://}"
          PGSSLMODE=require pg_dump --dbname="$DB_URL" -f "backup_${TIMESTAMP}.sql"
          echo "TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          echo "Backup size: $(du -sh backup_${TIMESTAMP}.sql | cut -f1)"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.TIMESTAMP }}
          path: backup_*.sql
          retention-days: 90
